[project]
name = "idol-live-tracker"
version = "0.1.0"
description = "Idol live event tracker that scrapes schedules and syncs to Notion"
requires-python = ">=3.10"
dependencies = [
    "scrapling[all]>=0.4.7",
    "notion-client",
    "python-dotenv",
    "PyYAML",
    "anthropic",
    "google-genai",
    "httpx",
    "typer>=0.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pip-audit>=2.10.0",
]

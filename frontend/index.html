<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Tracker</title>
  <meta name="description" content="アイドルライブ日程を自動収集・追跡するツール。スケジュール自動取得 / Discord 通知。" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://live-tracker.aooba.net/" />
  <meta property="og:title" content="Live Tracker" />
  <meta property="og:description" content="アイドルライブ日程を自動収集・追跡するツール。スケジュール自動取得 / Discord 通知。" />
  <meta property="og:image" content="https://live-tracker.aooba.net/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ja_JP" />
  <meta property="og:site_name" content="Live Tracker" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Live Tracker" />
  <meta name="twitter:description" content="アイドルライブ日程を自動収集・追跡するツール。スケジュール自動取得 / Discord 通知。" />
  <meta name="twitter:image" content="https://live-tracker.aooba.net/og.png" />

  <script>
    (function () {
      var theme = localStorage.getItem("theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (theme === "dark" || (!theme && prefersDark)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

artists:
- name: avam
  display_name: AVAM
  theme_color: '#E91E8C'
  image_url: https://picsum.photos/seed/avam/400/300
  base_url: https://avam-fc.com/schedule
  analyzed_at: '2026-05-05'
  fetch:
    dynamic: true
  navigation:
    type: api_endpoint
    endpoint: /api/schedule/get
    method: POST
    body_template:
      start: '{month_start}'
      end: '{month_end}'
    range_months: 3
  response:
    format: json_array
    array_path: ''
    mapping:
      id: id
      title: title
      date: reception_date
      date_format: '%Y-%m-%d'
  detail:
    enabled: true
    url_pattern: '{base_url}/detail/{id}?d={date}'
    selectors:
      venue: p.mt-2::regex(🏰会場：([^\n]+))
      start_time: p.mt-2::regex(開演(\d+:\d+))
      ticket_url: p.mt-2 a::attr(href)

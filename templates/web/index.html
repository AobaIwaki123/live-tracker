{% extends "layout.html" %}

{% block title %}ホーム - Idol Live Tracker{% endblock %}

{% block content %}
<section class="hero">
    <h2>Favorite Groups</h2>
    <p>クリックして詳細なスケジュールを確認できます。</p>
</section>

<div class="artist-grid">
    {% for artist in artists %}
    <a href="/artist/{{ artist.name }}" class="artist-card">
        <div class="image-wrapper">
            <img src="{{ artist.image_url }}" alt="{{ artist.display_name }}">
        </div>
        <div class="artist-info">
            <h3>{{ artist.display_name }}</h3>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
